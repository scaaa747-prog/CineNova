name: CineNova CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cinenova-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Assemble debug APK (push/PR)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: gradle assembleDebug --stacktrace

      - name: Assemble release APK (tag)
        if: startsWith(github.ref, 'refs/tags/v')"
        run: gradle assembleRelease --stacktrace

      - name: Upload debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: cinenova-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: cinenova-release-apk
          path: app/build/outputs/apk/release/app-release.apk

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: cinenova-release-apk
          path: .

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app-release.apk
